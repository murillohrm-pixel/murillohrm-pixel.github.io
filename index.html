<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Manutenções - Defensoria</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { font-family: Arial; margin: 20px; background: #f4f6f8; }
h2 { text-align: center; }

.container { display: flex; gap: 20px; }
.esquerda { width: 50%; }
.direita { width: 50%; }

#map { height: 500px; background: #ddd; border-radius: 10px; }

table { width: 100%; border-collapse: collapse; background: white; font-size: 12px; }
th { background: #2c3e50; color: white; padding: 6px; }
td { padding: 6px; border-bottom: 1px solid #ddd; }

.leaflet-tooltip {
  background: rgba(255,255,255,0.7);
  border: none;
  font-size: 10px;
}
</style>

</head>

<body>

<h2>Manutenções por Unidade</h2>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/topojson-client@3"></script>

<script>

// 🎨 CORES
const coresRegionais = {
  "1ª Regional de Campo Grande": "#1f77b4",
  "2ª Regional de Corumbá": "#2ca02c",
  "3ª Regional de Coxim": "#ff7f0e",
  "4ª Regional de Dourados": "#d62728",
  "5ª Regional de Jardim": "#9467bd",
  "6ª Regional de Nova Andradina": "#8c564b",
  "7ª Regional de Paranaíba": "#e377c2",
  "8ª Regional de Ponta Porã": "#7f7f7f",
  "9ª Regional de Naviraí": "#bcbd22",
  "10ª Regional de Três Lagoas": "#17becf",
  "11ª Regional de Aquidauana": "#ff9896",
  "12ª Regional de Chapadão do Sul": "#98df8a",
  "13ª Regional de Maracaju": "#aec7e8"
};

let unidades = [];
let mapaMunicipioRegional = {};
let mapa;

// 🔥 CARREGAR DADOS
Promise.all([
  fetch('unidades.json').then(r => r.json()),
  fetch('municipios_ms.topojson').then(r => r.json())
])
.then(([u, topo]) => {

  unidades = u;

  montarMapaMunicipioRegional();

  iniciarMapa(topo);
});

// 🧠 MAPA MUNICÍPIO → REGIONAL
function montarMapaMunicipioRegional() {
  unidades.forEach(u => {
    if (u.municipio && u.Regionais) {
      mapaMunicipioRegional[u.municipio.toLowerCase()] = u.Regionais;
    }
  });
}

// 🗺️ MAPA
function iniciarMapa(topojsonData) {

  mapa = L.map('map').setView([-20.5, -54.5], 6);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(mapa);

  // 🔥 CONVERTER TOPOJSON → GEOJSON
  const geo = topojson.feature(
    topojsonData,
    topojsonData.objects[Object.keys(topojsonData.objects)[0]]
  );

  // 🎨 DESENHAR MUNICÍPIOS
  L.geoJSON(geo, {

    style: function(feature) {

      const nome = feature.properties.name.toLowerCase();
      const regional = mapaMunicipioRegional[nome];

      return {
        color: "#555",
        weight: 1,
        fillColor: coresRegionais[regional] || "#ccc",
        fillOpacity: 0.5
      };
    },

    onEachFeature: function(feature, layer) {

      const nome = feature.properties.name;
      const regional = mapaMunicipioRegional[nome.toLowerCase()] || "Sem regional";

      layer.bindTooltip(`
        <b>${nome}</b><br>
        ${regional}
      `);
    }

  }).addTo(mapa);

  // 📍 MARCADORES DAS UNIDADES
  unidades.forEach(u => {

    const lat = parseFloat(u.latitude);
    const lng = parseFloat(u.longitude);

    if (isNaN(lat) || isNaN(lng)) return;

    L.marker([lat, lng])
      .addTo(mapa)
      .bindTooltip(u.municipio);
  });
}

</script>

</body>
</html>
